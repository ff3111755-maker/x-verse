# Optional Blueprint. Manual New > Web Service > Docker > Free works too.
# No persistent disk, database credentials, or paid instance is configured.
services:
  - type: web
    name: x-verse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: STORAGE_MODE
        value: browser
      - key: RUNNER_MODE
        value: disabled
      - key: ALLOWED_ORIGINS
        value: ""